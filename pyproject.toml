[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501", # long lines in prompts/sql
    "SIM105",
    "RUF001", "RUF002", "RUF003", # cyrillic text
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
